  /api/v1/orgs/{org_id}/:
    get:
      operationId: orgs_retrieve
      description: |-
        For views nested under /orgs/<org_id>/. After permissions run, self.org and self.membership are set.

        Views declare `capabilities = {"list": "property.view", "create": "property.manage", ...}`; actions
        missing from the map default to "<scope>.view" for safe methods and "<scope>.manage" otherwise.
      parameters:
      - in: path
        name: org_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - orgs
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
          description: ''
    patch:
      operationId: orgs_partial_update
      description: |-
        For views nested under /orgs/<org_id>/. After permissions run, self.org and self.membership are set.

        Views declare `capabilities = {"list": "property.view", "create": "property.manage", ...}`; actions
        missing from the map default to "<scope>.view" for safe methods and "<scope>.manage" otherwise.
      parameters:
      - in: path
        name: org_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - orgs
      requestBody:
        content:
          application/json:
            schema:
