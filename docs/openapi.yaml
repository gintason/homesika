openapi: 3.0.3
info:
  title: Homesika API
  version: 1.0.0
paths:
  /api/v1/auth/login/:
    post:
      operationId: auth_login_create
      description: 'New or reinstalled device: phone/email + PIN, then a code to prove
        it''s really you.'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginStart'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginStart'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginStart'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout_create
      description: 'Sign this device out: blacklist the refresh token and forget the
        device.'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Logout'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Logout'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Logout'
        required: true
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/otp/resend/:
    post:
      operationId: auth_otp_resend_create
