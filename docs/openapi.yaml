    PanicAlertKindEnum:
      enum:
      - help
      - robbery
      - kidnapping
      - fire
      - medical
      - suspicious_person
      - drill
      type: string
      description: |-
        * `help` - Help needed
        * `robbery` - Robbery / break-in
        * `kidnapping` - Kidnapping
        * `fire` - Fire
        * `medical` - Medical emergency
        * `suspicious_person` - Suspicious person
        * `drill` - Test (drill)
    PanicAlertStatusEnum:
      enum:
      - triggered
      - acknowledged
      - responding
      - resolved
      - false_alarm
      - cancelled
      type: string
      description: |-
        * `triggered` - Raised
        * `acknowledged` - Seen by security
        * `responding` - Security on the way
        * `resolved` - Resolved
        * `false_alarm` - False alarm
        * `cancelled` - Cancelled by the resident
    PanicKindEnum:
      enum:
      - help
      - robbery
      - kidnapping
      - fire
      - medical
      - suspicious_person
      type: string
      description: |-
        * `help` - Help needed
        * `robbery` - Robbery / break-in
        * `kidnapping` - Kidnapping
        * `fire` - Fire
        * `medical` - Medical emergency
        * `suspicious_person` - Suspicious person
