openapi: 3.0.3
info:
  title: Homesika API
  version: 1.0.0
paths:
  /api/v1/artisans/apply/:
    post:
      operationId: artisans_apply_create
      description: Sign up as an artisan. Needs consent to the ID, guarantor and reference
        checks.
      tags:
      - artisans
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Apply'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Apply'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Apply'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyArtisan'
          description: ''
  /api/v1/artisans/me/:
    get:
      operationId: artisans_me_retrieve
      tags:
      - artisans
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyArtisan'
          description: ''
    patch:
      operationId: artisans_me_partial_update
      tags:
      - artisans
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedMyArtisan'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedMyArtisan'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedMyArtisan'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyArtisan'
          description: ''
  /api/v1/artisans/me/jobs/:
    get:
      operationId: artisans_me_jobs_list
      description: My jobs (as an artisan). ?status=active (default) or history
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: status
        schema:
          type: string
          enum:
          - active
          - history
      tags:
      - artisans
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedArtisanJobList'
          description: ''
  /api/v1/artisans/me/jobs/{id}/:
    get:
      operationId: artisans_me_jobs_retrieve
      description: My jobs (as an artisan). ?status=active (default) or history
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this job.
        required: true
      tags:
      - artisans
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtisanJob'
          description: ''
  /api/v1/artisans/me/jobs/{id}/accept/:
    post:
      operationId: artisans_me_jobs_accept_create
      description: My jobs (as an artisan). ?status=active (default) or history
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this job.
        required: true
      tags:
      - artisans
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Schedule'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Schedule'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Schedule'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtisanJob'
          description: ''
  /api/v1/artisans/me/jobs/{id}/comments/:
    post:
      operationId: artisans_me_jobs_comments_create
      description: My jobs (as an artisan). ?status=active (default) or history
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this job.
        required: true
      tags:
      - artisans
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Note'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Note'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Note'
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
          description: ''
  /api/v1/artisans/me/jobs/{id}/complete/:
    post:
      operationId: artisans_me_jobs_complete_create
      description: My jobs (as an artisan). ?status=active (default) or history
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this job.
        required: true
      tags:
      - artisans
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Note'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Note'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Note'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtisanJob'
          description: ''
  /api/v1/artisans/me/jobs/{id}/decline/:
    post:
      operationId: artisans_me_jobs_decline_create
      description: My jobs (as an artisan). ?status=active (default) or history
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this job.
        required: true
      tags:
      - artisans
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Decline'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Decline'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Decline'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtisanJob'
          description: ''
  /api/v1/artisans/me/jobs/{id}/photos/:
    post:
      operationId: artisans_me_jobs_photos_create
      description: My jobs (as an artisan). ?status=active (default) or history
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this job.
        required: true
      tags:
      - artisans
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PhotoUpload'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketPhoto'
          description: ''
  /api/v1/artisans/me/jobs/{id}/schedule/:
    post:
      operationId: artisans_me_jobs_schedule_create
      description: My jobs (as an artisan). ?status=active (default) or history
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this job.
        required: true
      tags:
      - artisans
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Schedule'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Schedule'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Schedule'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtisanJob'
          description: ''
  /api/v1/artisans/me/jobs/{id}/start/:
    post:
      operationId: artisans_me_jobs_start_create
      description: My jobs (as an artisan). ?status=active (default) or history
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this job.
        required: true
      tags:
      - artisans
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtisanJob'
          description: ''
  /api/v1/artisans/me/verification/address/:
    post:
      operationId: artisans_me_verification_address_create
      description: A proof of address, read by AI and compared with the address they
        gave.
      tags:
      - artisans
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AddressProof'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyArtisan'
          description: ''
  /api/v1/artisans/me/verification/id/:
    post:
      operationId: artisans_me_verification_id_create
      tags:
      - artisans
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/IdSubmit'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyArtisan'
          description: ''
  /api/v1/artisans/me/verification/review/:
    post:
      operationId: artisans_me_verification_review_create
      description: Ask a person to look at a check that failed automatically (NDPA
        right to human review).
      tags:
      - artisans
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ReviewRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReviewRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyArtisan'
          description: ''
  /api/v1/artisans/me/verification/vouchers/:
    post:
      operationId: artisans_me_verification_vouchers_create
      tags:
      - artisans
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoucherCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/VoucherCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VoucherCreate'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyVoucher'
          description: ''
  /api/v1/artisans/me/verification/vouchers/{id}/:
    delete:
      operationId: artisans_me_verification_vouchers_destroy
      description: Remove someone who hasn't answered yet (e.g. a wrong number).
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - artisans
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/artisans/me/verification/vouchers/{id}/resend/:
    post:
      operationId: artisans_me_verification_vouchers_resend_create
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - artisans
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyVoucher'
          description: ''
  /api/v1/assistant/actions/{id}/{decision}/:
    post:
      operationId: assistant_actions_create
      parameters:
      - in: path
        name: decision
        schema:
          type: string
          pattern: ^confirm|reject$
        required: true
      - in: path
        name: id
        schema:
          type: string
          pattern: ^[0-9a-f-]{36}$
        required: true
      tags:
      - assistant
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reply'
          description: ''
  /api/v1/assistant/messages/:
    get:
      operationId: assistant_messages_retrieve
      description: POST a message to the assistant (app or web); GET this channel's
        recent messages.
      tags:
      - assistant
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistantHistory'
          description: ''
    post:
      operationId: assistant_messages_create
      description: POST a message to the assistant (app or web); GET this channel's
        recent messages.
      tags:
      - assistant
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Chat'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Chat'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Chat'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reply'
          description: ''
    delete:
      operationId: assistant_messages_destroy
      description: 'NDPA: erase my assistant conversations (app and web).'
      tags:
      - assistant
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/login/:
    post:
      operationId: auth_login_create
      description: 'New or reinstalled device: phone/email + PIN, then a code to prove
        it''s really you.'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginStart'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginStart'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginStart'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout_create
      description: 'Sign this device out: blacklist the refresh token and forget the
        device.'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Logout'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Logout'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Logout'
        required: true
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/otp/resend/:
    post:
      operationId: auth_otp_resend_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OTP'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OTP'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OTP'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/auth/otp/verify/:
    post:
      operationId: auth_otp_verify_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Verify'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Verify'
          multipart/form-data:
            schema:
