                  $ref: '#/components/schemas/MyLease'
          description: ''
  /api/v1/me/login-pin/:
    post:
      operationId: me_login_pin_create
      tags:
      - me
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeLoginPIN'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChangeLoginPIN'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChangeLoginPIN'
        required: true
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/me/pay/:
    post:
      operationId: me_pay_create
      description: 'Tenant pays some of their charges in the app: creates a link per
        landlord and opens checkout.'
      tags:
      - me
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantPay'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TenantPay'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TenantPay'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/me/payments/:
    get:
      operationId: me_payments_list
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
