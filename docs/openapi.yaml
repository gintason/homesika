      required:
      - charges
      - created_at
      - currency
      - expires_at
      - gateway
      - id
      - reference
      - status
      - tenant
      - tenant_name
      - url
    PaymentLinkStatusEnum:
      enum:
      - pending
      - paid
      - expired
      - cancelled
      type: string
      description: |-
        * `pending` - Awaiting payment
        * `paid` - Paid
        * `expired` - Expired
        * `cancelled` - Cancelled
    PaymentStatusEnum:
      enum:
      - succeeded
      - reversed
      type: string
      description: |-
        * `succeeded` - Succeeded
        * `reversed` - Reversed / refunded
    PinLogin:
      type: object
      properties:
        device_id:
          type: string
          maxLength: 64
        device_secret:
          type: string
          maxLength: 128
        pin:
          type: string
          pattern: ^\d{6}$
      required:
      - device_id
      - device_secret
      - pin
    PinSetup:
      type: object
      properties:
        pin:
          type: string
          writeOnly: true
          pattern: ^\d{6}$
        pin_confirm:
          type: string
          writeOnly: true
        device_id:
          type: string
          pattern: ^[A-Za-z0-9_-]{16,64}$
        device_name:
          type: string
          default: ''
          maxLength: 100
        setup_token:
          type: string
      required:
      - device_id
      - pin
      - pin_confirm
      - setup_token
    PreferredLanguageEnum:
      enum:
      - en
      - pcm
      - fr
      type: string
      description: |-
        * `en` - English
        * `pcm` - Nigerian Pidgin
        * `fr` - Français
    Property:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 150
        kind:
          $ref: '#/components/schemas/PropertyKindEnum'
        address:
          type: string
          maxLength: 255
        city:
          type: string
          maxLength: 80
        state:
          type: string
          maxLength: 80
        country:
          type: string
          maxLength: 2
        notes:
          type: string
        is_archived:
          type: boolean
        unit_count:
          type: integer
          readOnly: true
        occupied_count:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - address
      - created_at
      - id
      - name
      - occupied_count
      - unit_count
    PropertyKindEnum:
      enum:
      - block
      - house
      - compound
      - commercial
      - mixed
      - other
      type: string
      description: |-
        * `block` - Block of flats
        * `house` - House / duplex
        * `compound` - Compound (face-me-I-face-you)
        * `commercial` - Commercial / shops
        * `mixed` - Mixed use
        * `other` - Other
    PurposeEnum:
      enum:
      - terms
      - privacy
      - whatsapp
      - marketing
      - location
      type: string
      description: |-
        * `terms` - Terms of service
        * `privacy` - Privacy policy
        * `whatsapp` - WhatsApp messages
        * `marketing` - Marketing
        * `location` - Location for safety alerts
    Register:
      type: object
      description: Step 1 of sign-up. Nothing is created until the code is verified.
      properties:
        first_name:
          type: string
          maxLength: 80
        last_name:
          type: string
          maxLength: 80
        phone_number:
          type: string
        email:
          oneOf:
          - type: string
            format: email
          - type: string
            maxLength: 0
        preferred_language:
          allOf:
          - $ref: '#/components/schemas/PreferredLanguageEnum'
          default: en
        channel:
          allOf:
          - $ref: '#/components/schemas/ChannelEnum'
          default: sms
        accept_terms:
          type: boolean
      required:
      - accept_terms
      - first_name
      - last_name
      - phone_number
    RentFrequencyEnum:
      enum:
      - monthly
      - quarterly
      - biannual
      - annual
      type: string
      description: |-
        * `monthly` - Monthly
        * `quarterly` - Every 3 months
        * `biannual` - Every 6 months
        * `annual` - Yearly
    RoleEnum:
      enum:
      - owner
      - manager
      - agent
      - accountant
      - estate_admin
      - security
      - viewer
      type: string
      description: |-
        * `owner` - Owner
        * `manager` - Manager
        * `agent` - Agent
        * `accountant` - Accountant
        * `estate_admin` - Estate admin
        * `security` - Security desk
        * `viewer` - Viewer (read only)
    SettlementAccount:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        gateway:
          allOf:
          - $ref: '#/components/schemas/GatewayEnum'
          readOnly: true
        bank_code:
          type: string
          maxLength: 10
        bank_name:
          type: string
          maxLength: 80
        account_number:
          type: string
          writeOnly: true
          pattern: ^\d{10}$
        account_last4:
          type: string
          readOnly: true
        account_name:
          type: string
          maxLength: 120
        status:
          allOf:
          - $ref: '#/components/schemas/SettlementAccountStatusEnum'
          readOnly: true
        failure_reason:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - account_last4
      - account_number
      - bank_code
      - created_at
      - failure_reason
      - gateway
      - id
      - status
    SettlementAccountStatusEnum:
      enum:
      - active
      - failed
      - disabled
      type: string
      description: |-
        * `active` - Active
        * `failed` - Rejected by gateway
        * `disabled` - Disabled
    Tenant:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        full_name:
          type: string
          maxLength: 160
        phone_number:
          type: string
        email:
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        occupation:
          type: string
          maxLength: 100
        next_of_kin:
          type: string
          description: Name and phone (encrypted).
        id_document:
          type: string
          description: ID type and number (encrypted).
        notes:
          type: string
        has_app:
          type: boolean
          readOnly: true
        active_lease:
          type: object
          additionalProperties: {}
          nullable: true
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - active_lease
      - created_at
      - full_name
      - has_app
      - id
      - phone_number
    TenantPay:
      type: object
      properties:
        charges:
          type: array
          items:
            type: string
            format: uuid
          minItems: 1
        amount:
          type: string
          format: decimal
          example: '1500000.00'
      required:
      - charges
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
      required:
      - access
      - refresh
    TransactionPIN:
      type: object
      description: Setting or changing the transaction PIN needs the login PIN (step-up).
      properties:
        login_pin:
          type: string
          writeOnly: true
          pattern: ^\d{6}$
        pin:
          type: string
          writeOnly: true
          pattern: ^\d{4}$
        pin_confirm:
          type: string
          writeOnly: true
      required:
      - login_pin
      - pin
      - pin_confirm
    Unit:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        property:
          type: string
          format: uuid
          readOnly: true
        property_name:
          type: string
          readOnly: true
        label:
          type: string
          description: e.g. Flat 2B, Shop 4
          maxLength: 60
        kind:
          $ref: '#/components/schemas/UnitKindEnum'
        bedrooms:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          nullable: true
        default_rent_amount:
          type: string
          format: decimal
          example: '1500000.00'
          nullable: true
        status:
          $ref: '#/components/schemas/UnitStatusEnum'
        meter_number:
          type: string
          description: Prepaid meter, for bills (Phase 3).
          maxLength: 30
        disco:
          type: string
          description: Electricity distribution company.
          maxLength: 40
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - label
      - property
      - property_name
    UnitKindEnum:
      enum:
      - flat
      - room
      - house
      - shop
      - office
      - other
      type: string
      description: |-
        * `flat` - Flat / apartment
        * `room` - Room / self-contain
        * `house` - Whole house
        * `shop` - Shop
        * `office` - Office
        * `other` - Other
    UnitStatusEnum:
      enum:
      - vacant
      - occupied
      - unavailable
      type: string
      description: |-
        * `vacant` - Vacant
        * `occupied` - Occupied
        * `unavailable` - Unavailable (repairs etc.)
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        phone_number:
          type: string
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
          nullable: true
          title: Email address
        first_name:
          type: string
          maxLength: 80
        last_name:
          type: string
          maxLength: 80
        country:
          type: string
          description: ISO 3166-1 alpha-2
          maxLength: 2
        preferred_language:
          $ref: '#/components/schemas/PreferredLanguageEnum'
        is_phone_verified:
          type: boolean
          readOnly: true
        is_email_verified:
          type: boolean
          readOnly: true
        has_login_pin:
          type: boolean
          readOnly: true
        has_transaction_pin:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - email
      - has_login_pin
      - has_transaction_pin
      - id
      - is_email_verified
      - is_phone_verified
      - phone_number
    Verify:
      type: object
      properties:
        device_id:
          type: string
          pattern: ^[A-Za-z0-9_-]{16,64}$
        device_name:
          type: string
          default: ''
          maxLength: 100
        challenge_id:
          type: string
        code:
          type: string
          pattern: ^\d{6}$
      required:
      - challenge_id
      - code
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
