components:
  schemas:
    CategoryEnum:
      enum:
      - repairs
      - utilities
      - cleaning
      - security
      - agent_fee
      - legal
      - tax
      - insurance
      - other
      type: string
      description: |-
        * `repairs` - Repairs and maintenance
        * `utilities` - Utilities
        * `cleaning` - Cleaning and waste
        * `security` - Security
        * `agent_fee` - Agent / management fee
        * `legal` - Legal and professional
        * `tax` - Taxes and levies
