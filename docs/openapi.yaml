components:
  schemas:
    AssistantHistory:
      type: object
      properties:
        conversation:
          type: string
          format: uuid
          nullable: true
        messages:
          type: array
          items:
            $ref: '#/components/schemas/Message'
        pending_action:
          allOf:
          - $ref: '#/components/schemas/PendingAction'
          nullable: true
        escalated:
          type: boolean
      required:
      - conversation
      - escalated
      - messages
      - pending_action
    BillCategoryEnum:
      enum:
      - airtime
      - data
      - cable_tv
      - electricity
      type: string
      description: |-
        * `airtime` - Airtime
        * `data` - Data
        * `cable_tv` - Cable TV
        * `electricity` - Electricity
    BillCustomer:
      type: object
      properties:
        customer_id:
          type: string
        name:
          type: string
        details:
          type: object
          additionalProperties: {}
      required:
      - customer_id
      - details
      - name
    BillOrderStatusEnum:
      enum:
      - awaiting_payment
      - processing
      - delivered
      - refund_pending
      - refunded
      - expired
      type: string
      description: |-
        * `awaiting_payment` - Waiting for payment
        * `processing` - Paid, delivering
        * `delivered` - Delivered
        * `refund_pending` - Couldn't deliver, refunding
        * `refunded` - Refunded
        * `expired` - Payment not completed
    BillStatus:
      type: object
      properties:
        status:
          type: string
        receipt_number:
          type: string
      required:
      - receipt_number
      - status
    BillVerify:
      type: object
      properties:
        biller:
          type: string
          format: uuid
        plan:
          type: string
          format: uuid
          nullable: true
        customer_id:
          type: string
          maxLength: 40
      required:
      - biller
      - customer_id
    Biller:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        category:
          $ref: '#/components/schemas/BillCategoryEnum'
        code:
          type: string
          description: Our code, e.g. mtn, dstv, ikeja-electric.
          maxLength: 60
          pattern: ^[-a-zA-Z0-9_]+$
        name:
          type: string
          maxLength: 120
        customer_label:
          type: string
          maxLength: 60
        requires_verification:
          type: boolean
          description: Look up the meter/smartcard owner first.
        min_amount:
          type: string
          format: decimal
          example: '1500000.00'
          readOnly: true
          nullable: true
        max_amount:
          type: string
          format: decimal
          example: '1500000.00'
          readOnly: true
          nullable: true
        plans:
          type: array
          items:
            type: object
            additionalProperties: {}
          readOnly: true
      required:
      - category
      - code
      - id
      - max_amount
      - min_amount
      - name
      - plans
    ChangeLoginPIN:
      type: object
      properties:
        pin:
          type: string
          writeOnly: true
          pattern: ^\d{6}$
        pin_confirm:
          type: string
          writeOnly: true
        current_pin:
          type: string
          pattern: ^\d{6}$
      required:
      - current_pin
      - pin
      - pin_confirm
    Charge:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        lease:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/ChargeKindEnum'
        description:
          type: string
          maxLength: 160
        period_start:
          type: string
          format: date
          readOnly: true
          nullable: true
        period_end:
          type: string
          format: date
          readOnly: true
          nullable: true
        due_date:
          type: string
          format: date
        amount:
          type: string
          format: decimal
          example: '1500000.00'
        amount_paid:
          type: string
          format: decimal
          example: '1500000.00'
          readOnly: true
        balance:
          type: string
          format: decimal
          example: '1500000.00'
          readOnly: true
        currency:
          allOf:
          - $ref: '#/components/schemas/CurrencyEnum'
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/ChargeStatusEnum'
          readOnly: true
        is_overdue:
          type: boolean
          readOnly: true
        waived_reason:
          type: string
          readOnly: true
        tenant_name:
          type: string
          readOnly: true
          default: ''
        unit_label:
          type: string
          readOnly: true
        property_name:
          type: string
          readOnly: true
        organization:
          type: string
          format: uuid
          readOnly: true
        organization_name:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - amount
      - amount_paid
      - balance
      - created_at
      - currency
      - due_date
      - id
      - is_overdue
      - kind
      - lease
      - organization
      - organization_name
      - period_end
      - period_start
      - property_name
      - status
      - tenant_name
      - unit_label
      - waived_reason
    ChargeKindEnum:
      enum:
      - rent
      - service_charge
      - deposit
      - dues
      - other
      type: string
      description: |-
        * `rent` - Rent
        * `service_charge` - Service charge
        * `deposit` - Caution deposit
        * `dues` - Estate dues
        * `other` - Other
    ChargeStatusEnum:
      enum:
      - open
      - part_paid
      - paid
      - waived
      - void
      type: string
      description: |-
        * `open` - Unpaid
        * `part_paid` - Part paid
        * `paid` - Paid
        * `waived` - Waived
        * `void` - Cancelled
    Chat:
      type: object
      properties:
        text:
          type: string
          maxLength: 2000
        channel:
          allOf:
          - $ref: '#/components/schemas/ChatChannelEnum'
          default: app
      required:
      - text
    ChatChannelEnum:
      enum:
      - app
      - web
      type: string
      description: |-
        * `app` - app
        * `web` - web
    Consent:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        purpose:
          $ref: '#/components/schemas/PurposeEnum'
        version:
          type: string
          maxLength: 20
        granted_at:
          type: string
          format: date-time
          readOnly: true
        withdrawn_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - granted_at
      - id
      - purpose
      - version
      - withdrawn_at
    Conversation:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        channel:
          $ref: '#/components/schemas/ConversationChannelEnum'
        status:
          $ref: '#/components/schemas/ConversationStatusEnum'
        language:
          $ref: '#/components/schemas/LanguageEnum'
        contact_name:
          type: string
          readOnly: true
          default: ''
        contact_phone:
          type: string
          readOnly: true
          default: ''
        open_escalation:
          type: object
          additionalProperties: {}
          nullable: true
          readOnly: true
        last_message:
          type: object
          additionalProperties: {}
          nullable: true
          readOnly: true
        last_inbound_at:
          type: string
          format: date-time
          nullable: true
        last_message_at:
          type: string
          format: date-time
          nullable: true
        can_reply_freely:
          type: boolean
          readOnly: true
        handoff_by:
          type: string
          format: uuid
          nullable: true
      required:
      - can_reply_freely
      - channel
      - contact_name
      - contact_phone
      - id
      - last_message
      - open_escalation
    ConversationChannelEnum:
      enum:
      - whatsapp
      - app
      - web
      type: string
      description: |-
        * `whatsapp` - WhatsApp
        * `app` - Mobile app
        * `web` - Web dashboard
    ConversationDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        channel:
          $ref: '#/components/schemas/ConversationChannelEnum'
        status:
          $ref: '#/components/schemas/ConversationStatusEnum'
        language:
          $ref: '#/components/schemas/LanguageEnum'
        contact_name:
          type: string
          readOnly: true
          default: ''
        contact_phone:
          type: string
          readOnly: true
          default: ''
        open_escalation:
          type: object
          additionalProperties: {}
          nullable: true
          readOnly: true
        last_message:
          type: object
          additionalProperties: {}
          nullable: true
          readOnly: true
        last_inbound_at:
          type: string
          format: date-time
          nullable: true
        last_message_at:
          type: string
          format: date-time
          nullable: true
        can_reply_freely:
          type: boolean
          readOnly: true
        handoff_by:
          type: string
          format: uuid
          nullable: true
        messages:
          type: array
          items:
            type: object
            additionalProperties: {}
          readOnly: true
        escalations:
          type: array
          items:
            $ref: '#/components/schemas/Escalation'
          readOnly: true
      required:
      - can_reply_freely
      - channel
      - contact_name
      - contact_phone
      - escalations
      - id
      - last_message
      - messages
      - open_escalation
    ConversationStatusEnum:
      enum:
      - bot
      - handoff
      - closed
      type: string
      description: |-
        * `bot` - Assistant replying
        * `handoff` - A person has taken over
        * `closed` - Closed
    CreateOrder:
      type: object
      properties:
        biller:
          type: string
          format: uuid
        plan:
          type: string
          format: uuid
          nullable: true
        customer_id:
          type: string
          maxLength: 40
        amount:
          type: string
          format: decimal
          example: '1500000.00'
          nullable: true
        unit:
          type: string
          format: uuid
          nullable: true
      required:
      - biller
      - customer_id
    CurrencyEnum:
      enum:
      - NGN
      - USD
      - GBP
      - EUR
      - GHS
      - KES
      - ZAR
      - XOF
      - CAD
      type: string
      description: |-
        * `NGN` - NGN
        * `USD` - USD
        * `GBP` - GBP
        * `EUR` - EUR
        * `GHS` - GHS
        * `KES` - KES
        * `ZAR` - ZAR
        * `XOF` - XOF
        * `CAD` - CAD
    DataRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        kind:
          $ref: '#/components/schemas/DataRequestKindEnum'
        status:
          allOf:
          - $ref: '#/components/schemas/DataRequestStatusEnum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        completed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - completed_at
      - created_at
      - id
      - kind
      - status
    DataRequestKindEnum:
      enum:
      - export
      - delete
      type: string
      description: |-
        * `export` - Export my data
        * `delete` - Delete my account and data
    DataRequestStatusEnum:
      enum:
      - received
      - in_progress
      - completed
      - rejected
      type: string
      description: |-
        * `received` - Received
        * `in_progress` - In progress
        * `completed` - Completed
        * `rejected` - Rejected (legal retention)
    DirectionEnum:
      enum:
      - in
      - out
      type: string
      description: |-
        * `in` - From the person
        * `out` - To the person
    Enquiry:
      type: object
      properties:
