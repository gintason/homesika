      - starts_at
    SourceEnum:
      enum:
      - whatsapp
      - web
      - app
      - manual
      type: string
      description: |-
        * `whatsapp` - WhatsApp
        * `web` - Listing page
        * `app` - App
        * `manual` - Added by staff
    StaffReply:
      type: object
      properties:
        body:
          type: string
          maxLength: 4000
      required:
      - body
    StageEnum:
      enum:
      - new
      - contacted
      - viewing_booked
      - viewed
      - applied
      - won
      - lost
      type: string
      description: |-
        * `new` - New
        * `contacted` - Contacted
        * `viewing_booked` - Viewing booked
        * `viewed` - Viewed
        * `applied` - Applied
        * `won` - Became a tenant
        * `lost` - Lost
    Tenant:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        full_name:
          type: string
          maxLength: 160
        phone_number:
          type: string
        email:
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        occupation:
          type: string
          maxLength: 100
        next_of_kin:
          type: string
          description: Name and phone (encrypted).
        id_document:
          type: string
          description: ID type and number (encrypted).
        notes:
          type: string
        has_app:
          type: boolean
          readOnly: true
        active_lease:
          type: object
          additionalProperties: {}
          nullable: true
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - active_lease
      - created_at
      - full_name
      - has_app
      - id
      - phone_number
    TenantPay:
      type: object
      properties:
        charges:
          type: array
          items:
            type: string
            format: uuid
          minItems: 1
        amount:
          type: string
          format: decimal
          example: '1500000.00'
      required:
      - charges
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
      required:
      - access
      - refresh
    TransactionPIN:
      type: object
      description: Setting or changing the transaction PIN needs the login PIN (step-up).
      properties:
        login_pin:
          type: string
          writeOnly: true
          pattern: ^\d{6}$
        pin:
          type: string
          writeOnly: true
          pattern: ^\d{4}$
        pin_confirm:
          type: string
          writeOnly: true
      required:
      - login_pin
      - pin
      - pin_confirm
    Unit:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        property:
          type: string
          format: uuid
          readOnly: true
        property_name:
          type: string
          readOnly: true
        label:
          type: string
          description: e.g. Flat 2B, Shop 4
          maxLength: 60
        kind:
          $ref: '#/components/schemas/UnitKindEnum'
        bedrooms:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          nullable: true
        default_rent_amount:
          type: string
          format: decimal
          example: '1500000.00'
          nullable: true
        status:
          $ref: '#/components/schemas/UnitStatusEnum'
        meter_number:
          type: string
          description: Prepaid meter, for bills (Phase 3).
          maxLength: 30
        disco:
          type: string
          description: Electricity distribution company.
          maxLength: 40
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - label
      - property
      - property_name
    UnitKindEnum:
      enum:
      - flat
      - room
      - house
      - shop
      - office
      - other
      type: string
      description: |-
        * `flat` - Flat / apartment
        * `room` - Room / self-contain
        * `house` - Whole house
        * `shop` - Shop
        * `office` - Office
        * `other` - Other
    UnitStatusEnum:
      enum:
      - vacant
      - occupied
      - unavailable
      type: string
      description: |-
        * `vacant` - Vacant
        * `occupied` - Occupied
        * `unavailable` - Unavailable (repairs etc.)
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        phone_number:
          type: string
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
          nullable: true
          title: Email address
        first_name:
          type: string
          maxLength: 80
        last_name:
          type: string
          maxLength: 80
        country:
          type: string
          description: ISO 3166-1 alpha-2
          maxLength: 2
        preferred_language:
          $ref: '#/components/schemas/PreferredLanguageEnum'
        is_phone_verified:
          type: boolean
          readOnly: true
        is_email_verified:
          type: boolean
          readOnly: true
        has_login_pin:
          type: boolean
          readOnly: true
        has_transaction_pin:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - email
      - has_login_pin
      - has_transaction_pin
      - id
      - is_email_verified
      - is_phone_verified
      - phone_number
    Verify:
      type: object
      properties:
        device_id:
          type: string
          pattern: ^[A-Za-z0-9_-]{16,64}$
        device_name:
          type: string
          default: ''
          maxLength: 100
        challenge_id:
          type: string
        code:
          type: string
          pattern: ^\d{6}$
      required:
      - challenge_id
      - code
    Viewing:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        lead:
          type: string
          format: uuid
          readOnly: true
        lead_name:
          type: string
          readOnly: true
        lead_phone:
          type: string
          readOnly: true
        listing:
          type: string
          format: uuid
          readOnly: true
        listing_title:
          type: string
          readOnly: true
        slot:
          type: string
          format: uuid
          readOnly: true
        starts_at:
          type: string
          format: date-time
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/ViewingStatusEnum'
          default: booked
        notes:
          type: string
          maxLength: 255
      required:
      - id
      - lead
      - lead_name
      - lead_phone
      - listing
      - listing_title
      - slot
      - starts_at
    ViewingBooked:
      type: object
      properties:
        status:
          type: string
        starts_at:
          type: string
          format: date-time
      required:
      - starts_at
      - status
    ViewingStatusEnum:
      enum:
      - booked
      - done
      - no_show
      - cancelled
      type: string
      description: |-
        * `booked` - Booked
        * `done` - Done
        * `no_show` - Didn't come
        * `cancelled` - Cancelled
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
