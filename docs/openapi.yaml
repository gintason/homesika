      tags:
      - me
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPaymentList'
          description: ''
  /api/v1/me/payments/{id}/receipt/:
    get:
      operationId: me_payments_receipt_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - me
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/pdf:
              schema:
                type: string
                format: binary
          description: ''
  /api/v1/me/transaction-pin/:
    post:
      operationId: me_transaction_pin_create
      tags:
      - me
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionPIN'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TransactionPIN'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TransactionPIN'
        required: true
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/me/whatsapp/:
    get:
      operationId: me_whatsapp_retrieve
      description: GET/PUT my WhatsApp preference (reminders and receipts on WhatsApp
        instead of SMS).
      tags:
      - me
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OptIn'
          description: ''
    put:
      operationId: me_whatsapp_update
      description: GET/PUT my WhatsApp preference (reminders and receipts on WhatsApp
        instead of SMS).
      tags:
      - me
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OptIn'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OptIn'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OptIn'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OptIn'
          description: ''
  /api/v1/orgs/:
    get:
      operationId: orgs_list
      description: Organizations I'm an active member of; POST creates one with me
        as owner.
      tags:
      - orgs
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Organization'
          description: ''
    post:
      operationId: orgs_create
      description: Organizations I'm an active member of; POST creates one with me
        as owner.
      tags:
      - orgs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Organization'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Organization'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Organization'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
          description: ''
  /api/v1/orgs/{org_id}/:
    get:
      operationId: orgs_retrieve
