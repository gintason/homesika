      enum:
      - report
      - completion
      type: string
      description: |-
        * `report` - The problem
        * `completion` - The finished work
    TicketPriorityEnum:
      enum:
      - low
      - normal
      - urgent
      - emergency
      type: string
      description: |-
        * `low` - Can wait
        * `normal` - Normal
        * `urgent` - Urgent
        * `emergency` - Emergency (danger or flooding)
    TicketStatusEnum:
      enum:
      - awaiting_approval
      - approved
      - assigned
      - in_progress
      - done
      - confirmed
      - rejected
      - cancelled
      type: string
      description: |-
        * `awaiting_approval` - Waiting for landlord approval
        * `approved` - Approved, finding an artisan
        * `assigned` - Artisan assigned
        * `in_progress` - Work in progress
        * `done` - Done, waiting for tenant to confirm
        * `confirmed` - Fixed and confirmed
        * `rejected` - Not approved
        * `cancelled` - Cancelled
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
      required:
      - access
      - refresh
    TradeEnum:
      enum:
      - plumbing
      - electrical
      - carpentry
      - painting
      - ac
      - generator
      - roofing
      - tiling
      - welding
      - appliance
      - pest
      - cleaning
      - locksmith
      - other
      type: string
      description: |-
        * `plumbing` - Plumbing
        * `electrical` - Electrical
        * `carpentry` - Carpentry and doors
        * `painting` - Painting
        * `ac` - Air conditioning
        * `generator` - Generator repair
        * `roofing` - Roofing
        * `tiling` - Tiling and masonry
        * `welding` - Welding and gates
        * `appliance` - Appliance repair
        * `pest` - Pest control
        * `cleaning` - Cleaning
        * `locksmith` - Locks and keys
        * `other` - Other
    TransactionPIN:
      type: object
      description: Setting or changing the transaction PIN needs the login PIN (step-up).
      properties:
        login_pin:
          type: string
          writeOnly: true
          pattern: ^\d{6}$
        pin:
          type: string
          writeOnly: true
          pattern: ^\d{4}$
        pin_confirm:
          type: string
          writeOnly: true
      required:
      - login_pin
      - pin
      - pin_confirm
    Trigger:
      type: object
      properties:
        estate:
          type: string
          format: uuid
        kind:
          allOf:
          - $ref: '#/components/schemas/PanicKindEnum'
          default: help
        silent:
          type: boolean
          default: false
        location:
          allOf:
          - $ref: '#/components/schemas/Location'
          nullable: true
          description: Only if the person agreed to share their location.
        client_id:
          type: string
          description: The phone's own id for this alert; a retry returns the same
            alert.
          maxLength: 64
      required:
      - estate
    Unit:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        property:
          type: string
          format: uuid
          readOnly: true
        property_name:
          type: string
          readOnly: true
        label:
          type: string
          description: e.g. Flat 2B, Shop 4
          maxLength: 60
        kind:
          $ref: '#/components/schemas/UnitKindEnum'
        bedrooms:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          nullable: true
        default_rent_amount:
          type: string
          format: decimal
          example: '1500000.00'
          nullable: true
        status:
          $ref: '#/components/schemas/UnitStatusEnum'
        meter_number:
          type: string
          description: Prepaid meter, for bills (Phase 3).
          maxLength: 30
        disco:
          type: string
          description: Electricity distribution company.
          maxLength: 40
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - label
      - property
      - property_name
    UnitKindEnum:
      enum:
      - flat
      - room
      - house
      - shop
      - office
      - other
      type: string
      description: |-
        * `flat` - Flat / apartment
        * `room` - Room / self-contain
        * `house` - Whole house
        * `shop` - Shop
        * `office` - Office
        * `other` - Other
    UnitStatusEnum:
      enum:
      - vacant
      - occupied
      - unavailable
      type: string
      description: |-
        * `vacant` - Vacant
        * `occupied` - Occupied
        * `unavailable` - Unavailable (repairs etc.)
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        phone_number:
          type: string
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
          nullable: true
          title: Email address
        first_name:
          type: string
          maxLength: 80
        last_name:
          type: string
          maxLength: 80
        country:
          type: string
          description: ISO 3166-1 alpha-2
          maxLength: 2
        preferred_language:
          $ref: '#/components/schemas/PreferredLanguageEnum'
        is_phone_verified:
          type: boolean
          readOnly: true
        is_email_verified:
          type: boolean
          readOnly: true
        has_login_pin:
          type: boolean
          readOnly: true
        has_transaction_pin:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - email
      - has_login_pin
      - has_transaction_pin
      - id
      - is_email_verified
      - is_phone_verified
      - phone_number
    VerificationCheckKindEnum:
      enum:
      - id
      - phone
      - address
      type: string
      description: |-
        * `id` - ID check
        * `phone` - Phone number
        * `address` - Address
    VerificationCheckStatusEnum:
      enum:
      - not_started
      - processing
      - pending
      - passed
      - failed
      type: string
      description: |-
        * `not_started` - Not started
        * `processing` - Being checked automatically
        * `pending` - Waiting for a person to review
        * `passed` - Passed
        * `failed` - Failed
    Verify:
      type: object
      properties:
        device_id:
          type: string
          pattern: ^[A-Za-z0-9_-]{16,64}$
        device_name:
          type: string
          default: ''
          maxLength: 100
        challenge_id:
          type: string
        code:
          type: string
          pattern: ^\d{6}$
      required:
      - challenge_id
      - code
    Viewing:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        lead:
          type: string
          format: uuid
          readOnly: true
        lead_name:
          type: string
          readOnly: true
        lead_phone:
          type: string
          readOnly: true
        listing:
          type: string
          format: uuid
          readOnly: true
        listing_title:
          type: string
          readOnly: true
        slot:
          type: string
          format: uuid
          readOnly: true
        starts_at:
          type: string
          format: date-time
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/ViewingStatusEnum'
          default: booked
        notes:
          type: string
          maxLength: 255
      required:
      - id
      - lead
      - lead_name
      - lead_phone
      - listing
      - listing_title
      - slot
      - starts_at
    ViewingBooked:
      type: object
      properties:
        status:
          type: string
        starts_at:
          type: string
          format: date-time
      required:
      - starts_at
      - status
    ViewingStatusEnum:
      enum:
      - booked
      - done
      - no_show
      - cancelled
      type: string
      description: |-
        * `booked` - Booked
        * `done` - Done
        * `no_show` - Didn't come
        * `cancelled` - Cancelled
    VoucherCreate:
      type: object
      properties:
        kind:
          $ref: '#/components/schemas/VoucherKindEnum'
        full_name:
          type: string
          maxLength: 120
        phone_number:
          type: string
          maxLength: 20
        relationship:
          type: string
          maxLength: 80
        occupation:
          type: string
          default: ''
          maxLength: 80
        address:
          type: string
          default: ''
          maxLength: 255
      required:
      - full_name
      - kind
      - phone_number
      - relationship
    VoucherKindEnum:
      enum:
      - guarantor
      - reference
      type: string
      description: |-
        * `guarantor` - Guarantor
        * `reference` - Reference
    VoucherResponse:
      type: object
      properties:
        confirm:
          type: boolean
        comment:
          type: string
          default: ''
          maxLength: 300
      required:
      - confirm
    VoucherStatusEnum:
      enum:
      - pending
      - confirmed
      - declined
      - expired
      type: string
      description: |-
        * `pending` - Waiting for them to confirm
        * `confirmed` - Confirmed
        * `declined` - Declined
        * `expired` - Link expired
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
