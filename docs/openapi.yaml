openapi: 3.0.3
info:
  title: Homesika API
  version: 1.0.0
paths:
  /api/v1/assistant/actions/{id}/{decision}/:
    post:
      operationId: assistant_actions_create
      parameters:
      - in: path
        name: decision
        schema:
          type: string
          pattern: ^confirm|reject$
        required: true
      - in: path
        name: id
        schema:
          type: string
          pattern: ^[0-9a-f-]{36}$
        required: true
      tags:
      - assistant
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reply'
          description: ''
  /api/v1/assistant/messages/:
    get:
      operationId: assistant_messages_retrieve
      description: POST a message to the assistant (app or web); GET this channel's
        recent messages.
      tags:
      - assistant
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistantHistory'
          description: ''
    post:
      operationId: assistant_messages_create
      description: POST a message to the assistant (app or web); GET this channel's
        recent messages.
      tags:
      - assistant
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Chat'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Chat'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Chat'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reply'
          description: ''
    delete:
      operationId: assistant_messages_destroy
      description: 'NDPA: erase my assistant conversations (app and web).'
      tags:
      - assistant
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/login/:
    post:
      operationId: auth_login_create
      description: 'New or reinstalled device: phone/email + PIN, then a code to prove
        it''s really you.'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginStart'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginStart'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginStart'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout_create
      description: 'Sign this device out: blacklist the refresh token and forget the
        device.'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Logout'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Logout'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Logout'
        required: true
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/otp/resend/:
    post:
      operationId: auth_otp_resend_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OTP'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OTP'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OTP'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/auth/otp/verify/:
    post:
      operationId: auth_otp_verify_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Verify'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Verify'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Verify'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/auth/pin-login/:
    post:
      operationId: auth_pin_login_create
      description: 'Everyday login on a trusted device: PIN only.'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PinLogin'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PinLogin'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PinLogin'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/auth/pin/forgot/:
    post:
      operationId: auth_pin_forgot_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPin'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ForgotPin'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ForgotPin'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/auth/pin/setup/:
    post:
      operationId: auth_pin_setup_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PinSetup'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PinSetup'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PinSetup'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '201':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/auth/refresh/:
    post:
      operationId: auth_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/auth/register/:
    post:
      operationId: auth_register_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Register'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Register'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/bills/{reference}/status/:
    get:
      operationId: bills_status_retrieve
      description: 'For the page the gateway returns to (no login): status only, never
        the token.'
      parameters:
      - in: path
        name: reference
        schema:
          type: string
        required: true
      tags:
      - bills
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillStatus'
          description: ''
  /api/v1/bills/catalogue/:
    get:
      operationId: bills_catalogue_list
      description: Billers and plans. ?category=airtime|data|cable_tv|electricity
      tags:
      - bills
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Biller'
          description: ''
  /api/v1/bills/orders/:
    get:
      operationId: bills_orders_list
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - bills
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedOrderList'
          description: ''
    post:
      operationId: bills_orders_create
      tags:
      - bills
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrder'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateOrder'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateOrder'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
          description: ''
  /api/v1/bills/orders/{id}/:
    get:
      operationId: bills_orders_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - bills
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
          description: ''
  /api/v1/bills/orders/{id}/receipt/:
    get:
      operationId: bills_orders_receipt_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - bills
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/pdf:
              schema:
                type: string
                format: binary
          description: ''
  /api/v1/bills/verify/:
    post:
      operationId: bills_verify_create
      description: Look up a meter or smartcard owner before paying.
      tags:
      - bills
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BillVerify'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BillVerify'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BillVerify'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillCustomer'
          description: ''
  /api/v1/listings/:
    get:
      operationId: listings_list
      tags:
      - listings
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PublicListing'
          description: ''
  /api/v1/listings/{ref}/:
    get:
      operationId: listings_retrieve
      parameters:
      - in: path
        name: ref
        schema:
          type: string
        required: true
      tags:
      - listings
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicListingDetail'
          description: ''
  /api/v1/listings/{ref}/book/:
    post:
      operationId: listings_book_create
      parameters:
      - in: path
        name: ref
        schema:
          type: string
        required: true
      tags:
      - listings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicBooking'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PublicBooking'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PublicBooking'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ViewingBooked'
          description: ''
  /api/v1/listings/{ref}/enquire/:
    post:
      operationId: listings_enquire_create
      parameters:
      - in: path
        name: ref
        schema:
          type: string
        required: true
      tags:
      - listings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Enquiry'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Enquiry'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Enquiry'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnquiryReceived'
          description: ''
  /api/v1/me/:
    get:
      operationId: me_retrieve
      tags:
      - me
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    patch:
      operationId: me_partial_update
      tags:
      - me
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUser'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUser'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUser'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/me/charges/:
    get:
      operationId: me_charges_list
      description: 'My charges across all my landlords. Default: what I still owe;
        ?all=1 for history.'
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - me
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedChargeList'
          description: ''
  /api/v1/me/charges/{id}/:
    get:
      operationId: me_charges_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - me
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Charge'
          description: ''
  /api/v1/me/consents/:
    get:
      operationId: me_consents_list
      description: 'NDPA: list my consents; POST grants one (e.g. location for safety
        alerts).'
      tags:
      - me
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Consent'
          description: ''
    post:
      operationId: me_consents_create
      description: 'NDPA: list my consents; POST grants one (e.g. location for safety
        alerts).'
      tags:
      - me
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Consent'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Consent'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Consent'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Consent'
          description: ''
  /api/v1/me/consents/{purpose}/withdraw/:
    post:
      operationId: me_consents_withdraw_create
      parameters:
      - in: path
        name: purpose
        schema:
          type: string
        required: true
      tags:
      - me
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/me/data-requests/:
    get:
      operationId: me_data_requests_list
      description: 'NDPA: ask for a copy of my data, or for my account and data to
        be deleted.'
      tags:
      - me
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DataRequest'
          description: ''
    post:
      operationId: me_data_requests_create
      description: 'NDPA: ask for a copy of my data, or for my account and data to
        be deleted.'
      tags:
      - me
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DataRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DataRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
