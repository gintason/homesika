components:
  schemas:
    AddressProof:
      type: object
      properties:
        document:
          type: string
          format: uri
          description: A utility bill, bank statement or tenancy paper from the last
            3 months.
      required:
      - document
    Alert:
      type: object
      description: The security desk's view.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        estate:
          type: string
          format: uuid
          readOnly: true
        estate_name:
          type: string
          readOnly: true
        kind:
          allOf:
          - $ref: '#/components/schemas/PanicAlertKindEnum'
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/PanicAlertStatusEnum'
          readOnly: true
        silent:
          type: boolean
          readOnly: true
          description: Only security and managers are told; no sound.
        channel:
          type: string
          readOnly: true
          description: app, web or whatsapp
        raised_by_name:
          type: string
          readOnly: true
        raised_by_phone:
          type: string
          readOnly: true
        house:
          type: string
          readOnly: true
        location:
          allOf:
          - $ref: '#/components/schemas/AlertLocation'
          nullable: true
          readOnly: true
        false_alarms_90d:
          type: integer
          readOnly: true
          description: How many of this person's alerts were false alarms in the last
            90 days.
        created_at:
          type: string
          format: date-time
          readOnly: true
        acknowledged_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        responding_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        closed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        close_note:
          type: string
          readOnly: true
      required:
      - acknowledged_at
      - channel
      - close_note
      - closed_at
      - created_at
      - estate
      - estate_name
      - false_alarms_90d
      - house
      - id
      - kind
      - location
      - raised_by_name
      - raised_by_phone
      - responding_at
      - silent
      - status
    AlertDeliveryAudienceEnum:
      enum:
      - staff
      - resident
      - raiser
      type: string
      description: |-
        * `staff` - Security / estate staff
        * `resident` - Resident
        * `raiser` - The person who raised it
    AlertDeliveryChannelEnum:
      enum:
      - push
      - sms
      - ws
      type: string
      description: |-
        * `push` - Push
        * `sms` - SMS
        * `ws` - Security desk screen
    AlertDeliveryStatusEnum:
      enum:
      - queued
      - sent
      - delivered
      - acknowledged
      - failed
      type: string
      description: |-
        * `queued` - Queued
        * `sent` - Sent
        * `delivered` - Delivered
        * `acknowledged` - Seen
        * `failed` - Failed
    AlertDetail:
      type: object
      description: The security desk's view.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        estate:
          type: string
          format: uuid
          readOnly: true
        estate_name:
          type: string
          readOnly: true
        kind:
          allOf:
          - $ref: '#/components/schemas/PanicAlertKindEnum'
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/PanicAlertStatusEnum'
          readOnly: true
        silent:
          type: boolean
          readOnly: true
          description: Only security and managers are told; no sound.
        channel:
          type: string
          readOnly: true
          description: app, web or whatsapp
        raised_by_name:
          type: string
          readOnly: true
        raised_by_phone:
          type: string
          readOnly: true
        house:
          type: string
          readOnly: true
        location:
          allOf:
          - $ref: '#/components/schemas/AlertLocation'
          nullable: true
          readOnly: true
        false_alarms_90d:
          type: integer
          readOnly: true
          description: How many of this person's alerts were false alarms in the last
            90 days.
        created_at:
          type: string
          format: date-time
          readOnly: true
        acknowledged_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        responding_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        closed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        close_note:
          type: string
          readOnly: true
        notes:
          type: array
          items:
            $ref: '#/components/schemas/IncidentNote'
          readOnly: true
        deliveries:
          type: array
          items:
            $ref: '#/components/schemas/Delivery'
          readOnly: true
        metrics:
          allOf:
          - $ref: '#/components/schemas/Metrics'
          readOnly: true
      required:
      - acknowledged_at
      - channel
      - close_note
      - closed_at
      - created_at
      - deliveries
      - estate
      - estate_name
      - false_alarms_90d
      - house
      - id
      - kind
      - location
      - metrics
      - notes
      - raised_by_name
      - raised_by_phone
      - responding_at
      - silent
      - status
    AlertLocation:
      type: object
      properties:
        lat:
          type: number
          format: double
        lng:
          type: number
          format: double
        accuracy:
          type: number
          format: double
      required:
      - lat
      - lng
    AlertNote:
      type: object
      properties:
        note:
          type: string
          default: ''
          maxLength: 1000
    Analytics:
      type: object
      properties:
        currency:
          type: string
        months:
          type: array
          items:
            $ref: '#/components/schemas/AnalyticsMonth'
        now:
          $ref: '#/components/schemas/AnalyticsSnapshot'
      required:
      - currency
      - months
      - now
    AnalyticsMonth:
      type: object
      properties:
        month:
          type: string
          format: date
        billed:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,2})?$
        collected:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,2})?$
        payments:
          type: integer
        paid_against_billed:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,2})?$
        collection_rate:
          type: number
          format: double
          nullable: true
          description: '% of the month''s charges paid so far'
        charges:
          type: integer
