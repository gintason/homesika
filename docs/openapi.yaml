        '201':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/bills/{reference}/status/:
    get:
      operationId: bills_status_retrieve
      description: 'For the page the gateway returns to (no login): status only, never
        the token.'
      parameters:
      - in: path
        name: reference
        schema:
          type: string
        required: true
      tags:
      - bills
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillStatus'
          description: ''
  /api/v1/bills/catalogue/:
    get:
      operationId: bills_catalogue_list
      description: Billers and plans. ?category=airtime|data|cable_tv|electricity
      tags:
      - bills
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Biller'
          description: ''
  /api/v1/bills/intl/countries/:
    get:
      operationId: bills_intl_countries_list
      description: Countries we can send airtime to (GET /bills/intl/countries/).
      tags:
      - bills
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IntlCountry'
          description: ''
  /api/v1/bills/intl/lookup/:
    post:
      operationId: bills_intl_lookup_create
      description: Which network a number abroad is on, and the naira amounts it takes.
      tags:
      - bills
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntlLookup'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/IntlLookup'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/IntlLookup'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntlLookupResult'
          description: ''
  /api/v1/bills/intl/orders/:
    post:
      operationId: bills_intl_orders_create
      tags:
      - bills
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntlOrder'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/IntlOrder'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/IntlOrder'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
          description: ''
  /api/v1/bills/orders/:
    get:
      operationId: bills_orders_list
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - bills
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedOrderList'
          description: ''
    post:
      operationId: bills_orders_create
      tags:
      - bills
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrder'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateOrder'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateOrder'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
          description: ''
