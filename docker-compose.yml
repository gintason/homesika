# Local development stack. Staging/production run the same image with managed Postgres/Redis.
name: homesika

x-backend: &backend
  build:
    context: ./backend
    args:
      REQUIREMENTS: dev
  env_file: ./backend/.env
  environment:
    DJANGO_SETTINGS_MODULE: config.settings.local
  volumes:
    - ./backend:/app
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: homesika
      POSTGRES_USER: homesika
      POSTGRES_PASSWORD: homesika-dev-password
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homesika -d homesika"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6381}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    <<: *backend
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]
    ports:
      - "${API_HOST_BIND:-127.0.0.1}:${API_HOST_PORT:-8001}:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    <<: *backend
    depends_on:
      api:
        condition: service_healthy
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.local
      SKIP_MIGRATIONS: "1"
    command: ["celery", "-A", "config", "worker", "-l", "info", "-Q", "default"]
    healthcheck:
      disable: true

  # Dedicated worker so panic-alert fan-out (Phase 5) never waits behind other jobs.
  worker-alerts:
    <<: *backend
    depends_on:
      api:
        condition: service_healthy
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.local
      SKIP_MIGRATIONS: "1"
    command: ["celery", "-A", "config", "worker", "-l", "info", "-Q", "alerts", "--concurrency", "4"]
    healthcheck:
      disable: true

  beat:
    <<: *backend
    depends_on:
      api:
        condition: service_healthy
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.local
      SKIP_MIGRATIONS: "1"
    command: ["celery", "-A", "config", "beat", "-l", "info"]
    healthcheck:
      disable: true

volumes:
  pgdata:
  redisdata:
