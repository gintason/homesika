# Render Blueprint for Homesika STAGING (production = a copy with "-prod" names and live keys).
#
# TODO(verify): written from knowledge of Render's Blueprint spec; Render's own docs weren't
# reachable from the build environment. When you create the Blueprint, Render validates this file
# and lists any field it doesn't accept: send me the message and I'll fix it.
#
# Secrets marked `sync: false` are NOT stored here: Render asks you for them in its dashboard.

envVarGroups:
  - name: homesika-staging-shared
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.staging
      - key: ENVIRONMENT
        value: staging
      - key: DJANGO_SECRET_KEY
        generateValue: true          # Render generates a random value once
      - key: FIELD_ENCRYPTION_KEYS
        sync: false                  # paste: python -c "import os,base64;print(base64.b64encode(os.urandom(32)).decode())"
      - key: SENTRY_DSN
        sync: false
      - key: TIME_ZONE
        value: Africa/Lagos
      - key: LOG_LEVEL
        value: INFO
      - key: WEB_APP_URL                # links in SMS point here (the public pay page)
        value: https://homesika-staging-web.onrender.com
      - key: SMS_PROVIDER
        value: mock                    # change to "termii" once the sender ID is approved
      - key: TERMII_API_KEY
        sync: false
      - key: PAYMENT_GATEWAYS
        value: mock                    # change to "paystack,flutterwave" once TEST keys are set below
      - key: PAYSTACK_SECRET_KEY
        sync: false                    # sk_test_... on staging
      - key: FLUTTERWAVE_SECRET_KEY
        sync: false
      - key: FLUTTERWAVE_WEBHOOK_HASH
        sync: false
      - key: WHATSAPP_PROVIDER
        value: mock                    # change to "cloud" once the WhatsApp number is set up
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: SUPPORT_PHONE
        sync: false
      - key: ASSISTANT_PROVIDER
        value: mock                    # change to "anthropic" once ANTHROPIC_API_KEY is set
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-opus-5-5
      - key: PUSH_PROVIDER
        value: expo                    # panic alerts and announcements (Expo push service)
      - key: EXPO_ACCESS_TOKEN
        sync: false
      - key: ID_VERIFICATION_PROVIDER
        value: nin                     # NIN lookup + AI document reading; "manual" = staff review
      - key: NIN_PROVIDER
        value: mock                    # change to "smileid" after the sandbox check (docs/DEPLOY_RENDER.md)
      - key: SMILEID_PARTNER_ID
        sync: false
      - key: SMILEID_API_KEY
        sync: false
      - key: BILLS_PROVIDERS
        value: mock                    # change to "vtung,flutterwave" once VTU.ng is funded and keys are set
      - key: VTUNG_USERNAME
        sync: false
      - key: VTUNG_PASSWORD
        sync: false
      - key: VTUNG_USER_PIN
        sync: false
      - key: S3_BUCKET
        sync: false                    # listing photos; Render disks are wiped on deploy
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_PUBLIC_DOMAIN
        sync: false
      - key: S3_PRIVATE_BUCKET
        sync: false                    # repair photos and ID documents (no public access)

databases:
  - name: homesika-staging-db
    databaseName: homesika
    user: homesika
    region: frankfurt                # closest Render region to Nigeria at time of writing; TODO(verify)
    postgresMajorVersion: "16"
    plan: basic-256mb                # TODO(verify) plan name in your Render dashboard

services:
  # Redis (Render "Key Value"): Celery queues, cache, Channels layer.
  - type: keyvalue
    name: homesika-staging-redis
    region: frankfurt
    plan: starter                    # TODO(verify) plan name
    maxmemoryPolicy: noeviction      # queued jobs must never be evicted
    ipAllowList: []                  # private: only Render services can connect

  # API: Django + Channels (HTTP and WebSockets) served by Daphne.
  - type: web
    name: homesika-staging-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: frankfurt
    plan: starter
    healthCheckPath: /health/ready
    preDeployCommand: python manage.py migrate --noinput   # runs once per deploy, before traffic switches
    envVars:
      - fromGroup: homesika-staging-shared
      - key: SKIP_MIGRATIONS
        value: "1"                   # preDeployCommand migrates; containers never race each other
      - key: DATABASE_URL
        fromDatabase:
          name: homesika-staging-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: homesika-staging-redis
          property: connectionString
      - key: API_DOCS_ENABLED
        value: "true"
      - key: CORS_ALLOWED_ORIGINS
        sync: false                  # e.g. https://homesika-staging-web.onrender.com

  # Background jobs: reminders, receipts, reconciliation, provider calls.
  - type: worker
    name: homesika-staging-worker
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: frankfurt
    plan: starter
    dockerCommand: celery -A config worker -l info -Q default
    envVars:
      - fromGroup: homesika-staging-shared
      - key: SKIP_MIGRATIONS
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: homesika-staging-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: homesika-staging-redis
          property: connectionString

  # Panic alerts (Phase 5): its own worker so an alert never waits behind reminders or provider calls.
  - type: worker
    name: homesika-staging-alerts
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: frankfurt
    plan: starter
    dockerCommand: celery -A config worker -l info -Q alerts --concurrency 4
    envVars:
      - fromGroup: homesika-staging-shared
      - key: SKIP_MIGRATIONS
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: homesika-staging-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: homesika-staging-redis
          property: connectionString

  # Scheduler: queues the periodic jobs (one instance only).
  - type: worker
    name: homesika-staging-beat
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: frankfurt
    plan: starter
    dockerCommand: celery -A config beat -l info
    envVars:
      - fromGroup: homesika-staging-shared
      - key: SKIP_MIGRATIONS
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: homesika-staging-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: homesika-staging-redis
          property: connectionString

  # Web dashboard (static React build).
  - type: web
    name: homesika-staging-web
    runtime: static
    rootDir: web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite                # single-page app: every path serves index.html
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=()
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
    envVars:
      - key: VITE_API_URL
        sync: false                  # e.g. https://homesika-staging-api.onrender.com

